name: Seguridad

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "29 11 * * 1" # lunes, Bogotá
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secretos en el código (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # CLI de gitleaks (MIT). La action oficial exige licencia paga en organizaciones;
      # `go install` verifica el módulo contra sum.golang.org, no hace falta fijar checksums.
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: v8.30.1
        run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
      - name: Buscar secretos
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
        run: |
          # PR: solo sus commits. Push: lo nuevo. Programado/manual: todo el historial.
          RANGO=""
          if [ "$EVENTO" = "pull_request" ]; then RANGO="$BASE..$HEAD"
          elif [ "$EVENTO" = "push" ] && [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ]; then RANGO="$ANTES..$GITHUB_SHA"
          fi
          ARGS=(git --redact --no-banner --exit-code 1)
          if [ -f .gitleaks.toml ]; then ARGS+=(--config .gitleaks.toml); fi
          if [ -n "$RANGO" ]; then ARGS+=(--log-opts "$RANGO"); fi
          "$(go env GOPATH)/bin/gitleaks" "${ARGS[@]}"

  dependencies:
    name: Dependencias (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: npm audit (producción, bloquea en moderate+)
        run: npm audit --omit=dev --audit-level=moderate
      - name: npm audit (desarrollo, bloquea en high+)
        run: npm audit --audit-level=high

  sast:
    name: Análisis estático (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (OWASP, secretos, TypeScript y Node)
        run: pipx run --spec semgrep==1.184.0 semgrep scan --config p/owasp-top-ten --config p/secrets --config p/typescript --config p/nodejs --error --metrics=off --exclude node_modules src
