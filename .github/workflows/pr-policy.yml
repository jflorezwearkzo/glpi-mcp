name: Política del PR

# Rama de origen y título del PR. Va aparte del CI para poder correr también
# cuando se edita el PR (título corregido) sin volver a construir todo.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: politica-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  titulo:
    name: Título en Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Revisar el título del PR
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITULO" | grep -Eq '^(feat|fix|security|chore|docs|refactor|test|ci|perf|build|revert|release)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "::error::El título debe seguir Conventional Commits, p. ej. 'fix(hlapi): …'"; exit 1
          fi
