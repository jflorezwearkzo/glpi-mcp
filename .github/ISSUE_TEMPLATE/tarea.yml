name: Tarea o mejora
description: Algo para construir o cambiar en glpi-mcp
labels: [tarea]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué se necesita
    validations:
      required: true
  - type: textarea
    id: criterio
    attributes:
      label: Cómo sabremos que está listo
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [Herramientas, API legada, High-Level API, Transporte HTTP, Docker, CI, Docs]
